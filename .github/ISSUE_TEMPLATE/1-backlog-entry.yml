name: Backlog Entry
description: Add a new entry to the backlog.
title: "[Backlog]: "
labels: ["backlog"]
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this issue!
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: "Check only boxes that apply for your proposed entry."
      options:
        - label: Backlog entry requires creating new sandboxes.
          required: false
        - label: Backlog entry requires creating new exploitation code and/or tutorials.
          required: false
  - type: input
    id: cve
    attributes:
      label: CVE List
      description: If this entry involves introducing and/or exploiting CVEs, please list their codes below (comma separated).
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide as much detail as possible.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct and Contributing Guidelines
      description: By submitting this issue, you agree to follow our Code of Conduct and Contributing Guidelines.
      options:
        - label: I have read the [Contributing Guide](https://github.com/GenAI-Security-Project/GenAI-Red-Team-Lab/blob/main/CONTRIBUTING.md) and the [Code of Conduct](https://github.com/GenAI-Security-Project/GenAI-Red-Team-Lab/blob/main/CODE_OF_CONDUCT.md).
          required: true

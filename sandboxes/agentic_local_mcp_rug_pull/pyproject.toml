[project]
name = "agentic-local-mcp-rug-pull"
version = "0.1.0"
description = "Local sandbox: attacker-controlled MCP server vs. a tool-approval gateway"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121.3",
    "mcp==2.3.0",
    "openai>=2.8.1,<3",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
